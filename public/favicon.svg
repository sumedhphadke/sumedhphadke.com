  the typeface without depending on the font being available. Weight 700 rather
  than the 400/500 the site loads — at 16px the 500 stems break up, and optical
  compensation at icon size is the point of a second weight, not a new one.
  Colours are --color-accent and --color-text-primary from tokens.css; they are
  literals here because a static asset can't read a custom property.
-->
